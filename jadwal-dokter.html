<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadwal Praktik Dokter - RSU Permata Medika</title>
<style>
:root{--red:#c91424;--red2:#ed1b2f}*{box-sizing:border-box}body{margin:0;background:#eef2ee;font-family:Arial,system-ui,sans-serif;color:#171717}.app{max-width:760px;margin:auto;min-height:100vh;background:#f8f8f8}.hero{padding:28px 22px 92px;color:#fff;background:linear-gradient(135deg,#c91424,#8f0d18);border-radius:0 0 34px 34px}.brand{font-weight:900;letter-spacing:.18em;font-size:14px}.hotline{float:right;border:1px solid #ffffff55;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:800;color:#fff;text-decoration:none}.hero h1{font-size:clamp(34px,8vw,52px);line-height:1;margin:34px 0 10px;font-weight:950}.hero p{font-size:18px;margin:0;line-height:1.4}.panel{margin:-54px 10px 24px;padding:18px;border-radius:26px;background:#fff;box-shadow:0 12px 30px #0002;position:relative}input,select{width:100%;height:58px;margin-bottom:10px;border:1px solid #ddd;border-radius:17px;padding:0 16px;font:inherit;font-size:16px;background:#fff}input{padding-left:48px}.search{position:relative}.search span{position:absolute;left:17px;top:14px;font-size:25px;color:#777}.stats{margin:0 12px 14px;color:#666;font-weight:700}.list{display:grid;gap:16px;padding:0 10px 30px}.card{overflow:hidden;border:1px solid #e5e5e5;border-radius:25px;background:#fff;box-shadow:0 8px 22px #0001}.photo{background:#eee;min-height:300px;display:flex;align-items:center;justify-content:center}.photo img{display:block;width:100%;max-height:520px;object-fit:contain}.placeholder{height:300px;width:100%;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:900;color:#fff;background:linear-gradient(145deg,#b30f20,#e71b30)}.body{padding:18px}.name{margin:0;text-align:center;color:#9f101c;font-size:25px;font-weight:950}.badge{margin:10px 0;padding:9px 12px;border-radius:14px;text-align:center;background:linear-gradient(90deg,#c91424,#ed1b2f);color:#fff;font-weight:900;font-size:13px}.schedule{padding:14px;border:1px solid #efd9d9;border-radius:17px;background:#fff5f5;text-align:center;font-size:16px;font-weight:700;line-height:1.5;white-space:pre-line}.empty{padding:30px;border:1px dashed #ccc;border-radius:22px;text-align:center;color:#777}
</style></head><body><main class="app"><section class="hero"><a class="hotline" href="./index.html">Hotline</a><div class="brand">RSU PERMATA MEDIKA</div><h1>Jadwal Praktik Dokter</h1><p>Informasi dokter, spesialisasi dan jadwal pelayanan</p></section><section class="panel"><div class="search"><span>⌕</span><input id="search" placeholder="Cari dokter atau spesialis..." type="search"></div><select id="specialty"><option value="">Semua Spesialisasi</option></select><select id="day"><option value="">Semua Hari</option><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option></select></section><div class="stats" id="stats">Memuat jadwal dokter...</div><section class="list" id="list"></section></main>
<script>
let doctors=[];
const $=function(s){return document.querySelector(s)};
const esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})};
function render(){
 const q=$("#search").value.trim().toLowerCase(),sp=$("#specialty").value,day=$("#day").value;
 const shown=doctors.filter(function(d){const hay=[d.name,d.specialty,d.day,d.schedule].join(" ").toLowerCase();return(!q||hay.indexOf(q)>=0)&&(!sp||d.specialty===sp)&&(!day||d.day===day||String(d.schedule||"").toLowerCase().indexOf(day.toLowerCase())>=0)});
 $("#stats").textContent="Menampilkan "+shown.length+" dari "+doctors.length+" jadwal dokter";
 if(!shown.length){$("#list").innerHTML='<div class="empty">Tidak ada jadwal yang cocok dengan pencarian/filter.</div>';return}
 $("#list").innerHTML=shown.map(function(d){
   const photo=d.image?'<img src="'+esc(d.image)+'" alt="'+esc(d.name)+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;placeholder&quot;>DR</div>\'">':'<div class="placeholder">DR</div>';
   return '<article class="card"><div class="photo">'+photo+'</div><div class="body"><h2 class="name">'+esc(d.name||"Jadwal Dokter")+'</h2><div class="badge">'+esc(d.specialty||"Spesialisasi belum diisi")+'</div><div class="schedule">'+esc(d.schedule||"Jadwal belum diisi")+'</div></div></article>';
 }).join("");
}
async function load(){
 try{
   const r=await fetch("./data/jadwal.json?"+Date.now(),{cache:"no-store"});
   if(!r.ok)throw Error("HTTP "+r.status);
   doctors=await r.json();if(!Array.isArray(doctors))doctors=[];
   const specs=[...new Set(doctors.map(function(d){return d.specialty}).filter(Boolean))].sort();
   $("#specialty").innerHTML='<option value="">Semua Spesialisasi</option>'+specs.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join("");
   render();
 }catch(e){console.error(e);$("#stats").textContent="Gagal memuat data jadwal dokter.";$("#list").innerHTML='<div class="empty">Data jadwal tidak dapat dimuat.</div>'}
}
$("#search").addEventListener("input",render);$("#specialty").addEventListener("change",render);$("#day").addEventListener("change",render);load();
</script></body></html>

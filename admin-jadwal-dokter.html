<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Jadwal Dokter - RSU Permata Medika</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4f7f2,#dce9df);font-family:Arial,system-ui,sans-serif;color:#10251d}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px}.hero{padding:25px 22px 70px;border-radius:28px;background:linear-gradient(135deg,#0b4938,#05281f);color:#fff}.brand{font-weight:900;letter-spacing:.18em;font-size:13px}.hero h1{font-size:42px;line-height:1;margin:32px 0 8px}.hero p{margin:0;color:#dce9df}.panel{margin:-42px 10px 20px;padding:18px;border-radius:24px;background:#fff;box-shadow:0 16px 35px #05281f22;position:relative}.field{display:grid;gap:7px;margin-bottom:12px}.field label{font-weight:800;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dfda;border-radius:14px;padding:13px;font:inherit;background:#fff}.field textarea{min-height:80px;resize:vertical}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer}.primary{background:#0b4938;color:#fff}.secondary{background:#eef4ef;color:#0b4938}.stats{font-weight:800;color:#64716b;margin:0 12px 12px}.card{margin:0 10px 15px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 25px #05281f18}.card img{display:block;width:100%;max-height:420px;object-fit:contain;background:#eee}.body{padding:15px}.name{font-size:21px;font-weight:900}.badge{display:inline-block;background:#0b8060;color:#fff;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900}.schedule{margin-top:10px;padding:12px;border-radius:14px;background:#f7fbf8;white-space:pre-line}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.danger{color:#a3152a;background:#fff0f2}.notice{margin:10px 0 18px;padding:14px;border-radius:15px;background:#fff8df;border:1px solid #ecdba0;font-size:13px;line-height:1.5}.empty{padding:28px;text-align:center;color:#68756f;border:1px dashed #b9c8bf;border-radius:20px}@media(max-width:430px){.app{padding:0}.hero{border-radius:0 0 28px 28px}.panel{margin-left:8px;margin-right:8px}.buttons{grid-template-columns:1fr}.hero h1{font-size:36px}}
</style></head>
<body><main class="app"><section class="hero"><div class="brand">RSU PERMATA MEDIKA</div><h1>Admin Jadwal Dokter</h1><p>Kelola data jadwal yang akan ditampilkan pada halaman pasien.</p></section>
<section class="panel">
<div class="notice"><b>Cara kerja:</b> data pasien dibaca dari <code>data/jadwal.json</code>. Foto dokter disimpan di folder <code>foto/</code>. Setelah selesai, tekan <b>Download JSON</b>, lalu unggah file JSON dan foto ke GitHub.</div>
<div class="field"><label>Nama Dokter</label><input id="name" placeholder="dr. Taufiq Suwardi., Sp.OT"></div>
<div class="field"><label>Spesialisasi</label><input id="specialty" placeholder="Spesialis Bedah Tulang dan Trauma"></div>
<div class="field"><label>Hari Utama</label><select id="day"><option value="">Pilih hari</option><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option></select></div>
<div class="field"><label>Jadwal / Jam Praktik</label><textarea id="schedule" placeholder="Senin 08.30-11.30 WIB"></textarea></div>
<div class="field"><label>Nama file foto di folder <code>foto/</code></label><input id="image" placeholder="taufiq-suwardi.jpg"></div>
<div class="buttons"><button class="btn primary" id="save">Tambah / Simpan</button><button class="btn secondary" id="download">Download JSON</button></div>
</section><div class="stats" id="stats">Memuat data...</div><section id="list"></section></main>
<script>
let doctors=[];let editing=null;const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function load(){try{const r=await fetch('./data/jadwal.json?'+Date.now(),{cache:'no-store'});if(r.ok)doctors=await r.json();if(!Array.isArray(doctors))doctors=[];}catch(e){doctors=[]}render()}
function render(){ $('#stats').textContent=`Menampilkan ${doctors.length} jadwal dokter`;$('#list').innerHTML=doctors.length?doctors.map((d,i)=>`<article class="card"><img src="${esc(d.image||'')}" alt="${esc(d.name)}" onerror="this.style.display='none'"><div class="body"><div class="name">${esc(d.name)}</div><span class="badge">${esc(d.specialty)}</span><div class="schedule">${esc(d.schedule)}</div><div class="actions"><button class="btn secondary" onclick="edit(${i})">Edit</button><button class="btn danger" onclick="removeItem(${i})">Hapus</button></div></div></article>`).join(''):'<div class="empty">Belum ada jadwal dokter.</div>'}
function clearForm(){editing=null;$('#name').value='';$('#specialty').value='';$('#day').value='';$('#schedule').value='';$('#image').value='';$('#save').textContent='Tambah / Simpan'}
window.edit=i=>{const d=doctors[i];editing=i;$('#name').value=d.name||'';$('#specialty').value=d.specialty||'';$('#day').value=d.day||'';$('#schedule').value=d.schedule||'';$('#image').value=(d.image||'').replace(/^\.\/foto\//,'');$('#save').textContent='Simpan Perubahan';scrollTo({top:0,behavior:'smooth'})};
window.removeItem=i=>{if(confirm('Hapus jadwal ini?')){doctors.splice(i,1);render()}};
$('#save').onclick=()=>{const d={id:editing===null?Date.now().toString():doctors[editing].id,name:$('#name').value.trim(),specialty:$('#specialty').value.trim(),day:$('#day').value,schedule:$('#schedule').value.trim(),image:$('#image').value.trim()?('./foto/'+$('#image').value.trim()):''};if(!d.name)return alert('Nama dokter wajib diisi');if(editing===null)doctors.push(d);else doctors[editing]=d;clearForm();render()};
$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(doctors,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jadwal.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
load();
</script></body></html>
